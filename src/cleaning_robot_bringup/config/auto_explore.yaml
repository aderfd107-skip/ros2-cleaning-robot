auto_explore_and_save:
  ros__parameters:
    world_name: unknown
    map_topic: /map
    global_frame: map
    robot_base_frame: base_footprint
    navigate_to_pose_action: /navigate_to_pose
    clear_global_costmap_service: /global_costmap/clear_entirely_global_costmap
    clear_local_costmap_service: /local_costmap/clear_entirely_local_costmap
    save_map_service: /map_saver/save_map
    save_map_url: ""

    exploration_timeout: 120.0
    max_exploration_timeout: 220.0
    minimum_exploration_time: 45.0
    control_rate: 2.0
    status_log_interval: 8.0
    nav2_wait_timeout: 40.0
    save_retry_interval: 3.0
    clear_costmap_on_failure: true
    costmap_clear_cooldown: 4.0
    bootstrap_spin_enabled: false
    bootstrap_spin_target_yaw: 0.0
    bootstrap_spin_time_allowance: 20.0

    map_stall_duration: 18.0
    map_progress_min_known_area: 0.8
    map_progress_min_observed_area: 1.2
    map_progress_min_bbox_unknown_area_reduction: 0.5
    completion_min_observed_area: 18.0
    completion_max_bbox_unknown_ratio: 0.18
    completion_max_bbox_unknown_area: 3.0
    completion_require_both_bbox_metrics: false

    frontier_cluster_min_cells: 12
    frontier_target_reached_distance: 0.40
    frontier_target_timeout: 45.0
    frontier_target_switch_distance: 0.80
    frontier_size_weight: 0.08
    frontier_distance_weight: 1.0
    frontier_heading_weight: 0.35
    frontier_completion_max_clusters: 0
    frontier_completion_max_cells: 10
    frontier_target_cell_stride: 3
    frontier_target_offset: 0.20
    frontier_clearance_radius: 0.18
    frontier_blocked_path_penalty: 3.0
    frontier_unknown_path_penalty: 0.8
    frontier_max_path_occupied_ratio: 0.0
    frontier_max_path_unknown_ratio: 0.35
    frontier_failed_goal_cooldown: 18.0
    frontier_failed_goal_radius: 0.45
    frontier_failed_goal_max_retries: 3
    frontier_failed_goal_backoff: 1.5
    frontier_reached_goal_cooldown: 30.0
    frontier_reached_goal_radius: 0.0
    frontier_reached_cluster_radius: 0.0
    frontier_goal_progress_timeout: 14.0
    frontier_goal_progress_epsilon: 0.12
    frontier_max_recoveries: 2
